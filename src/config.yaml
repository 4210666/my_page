site:
  name: 张天硕
  site: 'https://zts666.me'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: null # 在 Google Search Console 验证自己的站点后填入

# Default SEO metadata
metadata:
  title:
    default: 张天硕 — 华东理工大学
    template: '%s — 张天硕'
  description: "张天硕，华东理工大学化工学院油气储运工程本科生，专业排名第一。关注 VIE 荧光材料研究、机器学习与计算机视觉、数学建模。"
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 张天硕 · 个人主页
    images:
      - url: '~/assets/images/og-image.png'
        width: 1200
        height: 630
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: zh-CN
  textDirection: ltr

apps:
  blog:
    isEnabled: false # 模板示例博客，暂不启用
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
